name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Java o'rnatish (Gradle uchun kerak)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Flutter SDK o'rnatish
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Eski android, ios va kesh fayllarini tozalash
        run: rm -rf android ios .dart_tool pubspec.lock .flutter-plugins .flutter-plugins-dependencies

      - name: Native loyihalarni qayta yaratish
        run: flutter create --org uz.uzumtezkor --project-name uzum_tezkor_customer .

      - name: Bog'liqliklarni o'rnatish
        run: |
          flutter clean
          flutter pub get

      - name: APK qurish (debug — kalit talab qilmaydi)
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://api.uzumtezkor.uz' }} \
            --dart-define=SOCKET_URL=${{ vars.SOCKET_URL || 'https://api.uzumtezkor.uz' }} \
            --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            --dart-define=GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}

      - name: APK'ni yuklab olish uchun saqlash
        uses: actions/upload-artifact@v4
        with:
          name: uzum-tezkor-customer-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
