name: uzum_tezkor_customer
description: "Uzum Tezkor darajasidagi ovqat yetkazib berish — mijoz mobil ilovasi"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1
  socket_io_client: ^2.0.3+1
  pretty_dio_logger: ^1.3.1

  # Auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  flutter_secure_storage: ^9.2.2

  # Maps & location
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  carousel_slider: ^4.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  pin_code_fields: ^8.0.1
  badges: ^3.1.2
  flutter_rating_bar: ^4.0.1
  smooth_page_indicator: ^1.1.0

  # Utils
  intl: ^0.19.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  device_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.5
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
